name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf build dist *.egg-info
          python -m build
          twine check dist/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: crstlmeth-dist
          path: dist/*

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: pypi
      url: https://pypi.org/project/crstlmeth/

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: crstlmeth-dist
          path: dist

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-ghcr:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Docker tags
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ihggm-aachen/crstlmeth:${{ steps.version.outputs.version }}
            ghcr.io/ihggm-aachen/crstlmeth:${{ steps.version.outputs.tag }}
            ghcr.io/ihggm-aachen/crstlmeth:latest
          labels: |
            org.opencontainers.image.source=https://github.com/IHGGM-Aachen/crstlmeth
            org.opencontainers.image.description=Clinical and ReSearch Tool for anaLysis of METHylation data
            org.opencontainers.image.licenses=MIT