name: Release

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.2
        required: true
        type: string
      publish_pypi:
        description: Publish to PyPI
        required: true
        default: true
        type: boolean
      publish_ghcr:
        description: Publish Docker image to GHCR
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf build dist *.egg-info
          python -m build
          twine check dist/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: crstlmeth-dist
          path: dist/*

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'release' || inputs.publish_pypi }}

    environment:
      name: pypi
      url: https://pypi.org/project/crstlmeth/

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: crstlmeth-dist
          path: dist

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-ghcr:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'release' || inputs.publish_ghcr }}

    permissions:
      contents: read
      packages: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Prepare Docker tags
        id: version
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ihggm-aachen/crstlmeth:${{ steps.version.outputs.version }}
            ghcr.io/ihggm-aachen/crstlmeth:${{ steps.version.outputs.tag }}
            ghcr.io/ihggm-aachen/crstlmeth:latest
          labels: |
            org.opencontainers.image.source=https://github.com/IHGGM-Aachen/crstlmeth
            org.opencontainers.image.description=Clinical and ReSearch Tool for anaLysis of METHylation data
            org.opencontainers.image.licenses=MIT